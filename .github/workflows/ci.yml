name: CI
on: [push, pull_request]
jobs:
  # Builds the image that actually ships, rather than running the two npm
  # builds on their own: that also covers the COPY paths and nginx.conf in
  # web/Dockerfile, which nothing validated before #34 except production.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f web/Dockerfile -t ink-gateway-web .
      # The SPA is served from a real /app/ subdirectory, not an nginx alias —
      # assert both entry points exist so a wrong COPY destination fails here
      # instead of silently 404ing in production.
      - name: Check both frontends landed in the image
        run: |
          docker run --rm ink-gateway-web sh -c '
            test -f /usr/share/nginx/html/index.html &&
            test -f /usr/share/nginx/html/app/index.html'
      - name: Check the nginx config is valid
        run: docker run --rm ink-gateway-web nginx -t
      # A failing healthcheck is not cosmetic: Traefik refuses to route to a
      # container whose Docker health isn't `healthy`, so the domain serves
      # "no available server" while nginx is up and fine. That took the site
      # down once already (#34) because nothing exercised the probe outside
      # production. Actually run the container and wait for it to go healthy.
      - name: Check the container reports healthy
        run: |
          docker run -d --name webhealth ink-gateway-web
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' webhealth)
            if [ "$status" = "healthy" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 1
          done
          echo "::error::container never became healthy (status: $(docker inspect --format '{{.State.Health.Status}}' webhealth))"
          docker inspect --format '{{json .State.Health}}' webhealth
          docker logs webhealth
          exit 1

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            api/target
          key: ${{ runner.os }}-cargo-api-${{ hashFiles('api/Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
