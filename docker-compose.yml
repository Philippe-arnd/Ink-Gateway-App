# Beta deployment: no Postgres, no Redis, no S3. One `data` volume holds both
# the book git working copies (/data/books) and the SQLite registry of
# users/sessions/books (/data/ink-gateway.db). See api/.env.example for the
# required secrets (INK_GATEWAY_MASTER_KEY, INK_GATEWAY_INVITE_CODE).
services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      BIND_ADDR: 0.0.0.0:8787
      DATABASE_URL: sqlite:///data/ink-gateway.db
      INK_GATEWAY_BOOKS_DIR: /data/books
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://ink-gateway.philapps.com}
      INK_GATEWAY_SECURE_COOKIES: "true"
      RUST_LOG: info
    volumes:
      - data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    # Both services pin their own Traefik router here rather than relying on
    # Coolify's Domains tab (see Ink-Gateway-App#34). The tab alone can't split
    # one domain across compose services, and the service it generates points
    # at the application-level `ports_exposes` — still "3000", a port nothing
    # here listens on, which is what left the bare domain answering Traefik's
    # "no available server" while nginx was up and healthy.
    #
    # Priorities are explicit and far above any rule-length default: Traefik
    # computes an unset priority from the rule string's length, so a small
    # explicit number would silently lose to an auto-generated router.
    labels:
      - traefik.enable=true
      - traefik.http.routers.ink-gateway-api.rule=Host(`${DOMAIN:-ink-gateway.philapps.com}`, `www.${DOMAIN:-ink-gateway.philapps.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.ink-gateway-api.entrypoints=https
      - traefik.http.routers.ink-gateway-api.tls=true
      - traefik.http.routers.ink-gateway-api.tls.certresolver=letsencrypt
      - traefik.http.routers.ink-gateway-api.priority=1000
      - traefik.http.services.ink-gateway-api.loadbalancer.server.port=8787
      - traefik.docker.network=coolify

  # One nginx serving the Astro landing at / and the React SPA at /app/ —
  # they were two separate services until #34 (see web/Dockerfile). Owns the
  # bare domain as the catch-all, at a priority just below api's so /api still
  # wins.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Ends in /api on purpose — the client prefixes /api too and Coolify
        # strips one back off. Don't simplify without reading web/Dockerfile.
        VITE_API_BASE: ${API_PUBLIC_URL:-https://ink-gateway.philapps.com/api}
        PUBLIC_APP_URL: ${APP_PUBLIC_URL:-https://ink-gateway.philapps.com/app}
    restart: unless-stopped
    expose:
      - "80"
    # Coolify reads healthchecks from THIS file, not from the image metadata —
    # `custom_healthcheck_found` stayed false through #35 and #36 even though
    # both added a HEALTHCHECK to the Dockerfiles, which is why they changed
    # nothing. With no healthcheck it can find, Coolify falls back to probing
    # the application-level `ports_exposes` (still "3000", a port no service
    # here listens on), marks the container unhealthy and restarts it — until
    # the restart cap tears the whole project down. That's the only
    # explanation for `web` going down too: a static nginx doesn't crash.
    # This block overrides the image's own HEALTHCHECK at runtime; the
    # Dockerfile keeps its copy so `docker ps` stays informative standalone.
    # 127.0.0.1, not `localhost` — see web/Dockerfile for why that difference
    # took the whole site down. A failing probe doesn't just look bad: Traefik
    # refuses to route to a container whose Docker health is not `healthy`.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.ink-gateway-web.rule=Host(`${DOMAIN:-ink-gateway.philapps.com}`, `www.${DOMAIN:-ink-gateway.philapps.com}`)
      - traefik.http.routers.ink-gateway-web.entrypoints=https
      - traefik.http.routers.ink-gateway-web.tls=true
      - traefik.http.routers.ink-gateway-web.tls.certresolver=letsencrypt
      - traefik.http.routers.ink-gateway-web.priority=900
      - traefik.http.services.ink-gateway-web.loadbalancer.server.port=80
      - traefik.docker.network=coolify

volumes:
  data:
