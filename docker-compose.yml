# Beta deployment: no Postgres, no Redis, no S3 — book content lives in git
# working copies on the `books` volume; the SQLite registry (users/sessions/
# book index) lives on the `data` volume. See api/.env.example for the
# required secrets (INK_GATEWAY_MASTER_KEY, INK_GATEWAY_INVITE_CODE).
services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: ./api/.env
    environment:
      BIND_ADDR: 0.0.0.0:8787
      DATABASE_URL: sqlite:///data/ink-gateway.db
      INK_GATEWAY_BOOKS_DIR: /data/books
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://ink-gateway.philapps.com}
      INK_GATEWAY_SECURE_COOKIES: "true"
      RUST_LOG: info
    volumes:
      - data:/data
    expose:
      - "8787"
    # Coolify's per-service Domain field alone doesn't reliably disambiguate
    # /app vs /api vs / on one shared domain for a docker-compose app (see
    # Ink-Gateway-App#34) — explicit labels + priority instead of relying on
    # auto-generated routers. landing keeps its Coolify-managed router as the
    # catch-all; these just need to consistently outrank it.
    labels:
      - traefik.enable=true
      - traefik.http.routers.ink-gateway-api.rule=Host(`${DOMAIN:-ink-gateway.philapps.com}`) && PathPrefix(`/api`)
      - traefik.http.routers.ink-gateway-api.entrypoints=https
      - traefik.http.routers.ink-gateway-api.tls=true
      - traefik.http.routers.ink-gateway-api.tls.certresolver=letsencrypt
      - traefik.http.routers.ink-gateway-api.priority=100
      - traefik.http.services.ink-gateway-api.loadbalancer.server.port=8787
      - traefik.docker.network=coolify

  app:
    build:
      context: ./app
      args:
        VITE_API_BASE: ${API_PUBLIC_URL:-https://ink-gateway.philapps.com/api}
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ink-gateway-app.rule=Host(`${DOMAIN:-ink-gateway.philapps.com}`) && PathPrefix(`/app`)
      - traefik.http.routers.ink-gateway-app.entrypoints=https
      - traefik.http.routers.ink-gateway-app.tls=true
      - traefik.http.routers.ink-gateway-app.tls.certresolver=letsencrypt
      - traefik.http.routers.ink-gateway-app.priority=100
      - traefik.http.services.ink-gateway-app.loadbalancer.server.port=80
      - traefik.docker.network=coolify

  landing:
    build:
      context: ./landing
      args:
        PUBLIC_APP_URL: ${APP_PUBLIC_URL:-https://ink-gateway.philapps.com/app}
    restart: unless-stopped
    expose:
      - "80"

volumes:
  data:
