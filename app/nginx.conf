server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth headers. The real trust boundary is the API's CORS +
    # SameSite=Strict session cookie — these just harden the static shell
    # against being embedded/sniffed by something else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Single-page app: any path not matching a real file falls back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
