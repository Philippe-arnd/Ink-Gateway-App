server {
    listen 80;

    # Defense-in-depth headers. The real trust boundary is the API's CORS +
    # SameSite=Strict session cookie — these just harden the static shell
    # against being embedded/sniffed by something else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # Served under /app on the same domain as landing (/) and api (/api) —
    # Traefik forwards the full path unstripped, same pattern as api's own
    # self-prefixed routes. Single-page app: any path under /app not
    # matching a real file falls back to /app/index.html.
    location /app/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }
}
