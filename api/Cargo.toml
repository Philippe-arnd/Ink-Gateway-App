[package]
name = "ink-gateway-api"
version = "0.1.0"
edition = "2024"

[dependencies]
# TODO: switch to `branch = "main"` (or a tag) once Ink-Gateway PR #14 merges.
ink_core = { package = "ink-cli", git = "https://github.com/Philippe-arnd/Ink-Gateway", branch = "feat/ink-core-lib" }
aes-gcm = "0.11.1"
anyhow = "1.0.104"
argon2 = "0.6.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs", "limit", "timeout"] }
tower-sessions = { version = "0.15.0", features = ["memory-store"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4"] }
async-trait = "0.1.92"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "gzip", "json"] }
tower_governor = "0.8.0"
governor = "0.10.4"
sha2 = "0.11.0"
