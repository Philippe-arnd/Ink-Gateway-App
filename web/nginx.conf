server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth headers. The real trust boundary is the API's CORS +
    # SameSite=Strict session cookie — these just harden the static shell
    # against being embedded/sniffed by something else.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # React SPA. Built with base=/app/ and copied to html/app/, so the URL
    # path matches the filesystem path and plain root+try_files works — no
    # `alias`, whose interaction with try_files is a well-known footgun.
    # Any path under /app that isn't a real file falls back to the SPA shell.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = /app {
        return 301 /app/;
    }

    # Astro marketing site. Serves / and is the catch-all for this container,
    # which is also what the Docker healthcheck probes.
    location / {
        try_files $uri $uri/ =404;
    }
}
